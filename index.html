<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e8eef6;
      --muted: #9aa8b8;
      --accent: #6cb6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e2a3d, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(40rem, 100%);
      background: var(--card);
      border: 1px solid #2b3b52;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello</h1>
    <p>This is your starting <code>index.html</code>. Open it in a browser and replace this content with your page.</p>
  </main>
</body>
</html>
